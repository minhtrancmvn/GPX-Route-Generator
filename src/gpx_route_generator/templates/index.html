<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPX Route Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-logo" href="/">
        <span class="site-logo-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9C3 5.686 5.686 3 9 3s6 2.686 6 6-2.686 6-6 6-6-2.686-6-6Z" stroke="#fff" stroke-width="1.4" fill="none"/>
            <path d="M6 9.5l2 2 4-4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="site-logo-name">GPX Route Generator</span>
        <span class="site-logo-tag">Local</span>
      </a>
    </div>
  </header>

  <main class="app-shell">
    <section class="workspace">
      <form id="render-form" class="panel controls">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Video settings</p>
            <h1>2D map animation</h1>
          </div>
          <span class="badge" id="request-estimate">240 map requests</span>
        </div>

        <!-- GPX file upload -->
        <div class="field" style="margin-bottom: 16px;">
          <span>GPX file</span>
          <label class="file-drop-zone" id="drop-zone">
            <input id="gpx-file" name="gpx_file" type="file" accept=".gpx,application/gpx+xml,text/xml" required>
            <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="drop-primary">Click to upload or drag &amp; drop</span>
            <span class="drop-secondary">.gpx files only</span>
            <span class="drop-filename" id="drop-filename"></span>
          </label>
        </div>

        <!-- Output format -->
        <fieldset class="field">
          <legend>Output format</legend>
          <div class="format-grid">
            <label class="format-option">
              <input type="radio" name="output_format" value="landscape" checked>
              <div class="format-preview landscape"></div>
              <strong>16:9 Landscape</strong>
              <small>1280 × 720</small>
            </label>
            <label class="format-option">
              <input type="radio" name="output_format" value="portrait">
              <div class="format-preview portrait"></div>
              <strong>9:16 Portrait</strong>
              <small>720 × 1280</small>
            </label>
          </div>
        </fieldset>

        <!-- Duration & FPS -->
        <div class="split">
          <label class="field">
            <span>Duration (sec)</span>
            <input id="duration" name="duration_seconds" type="number" min="5" max="30" step="1" value="10" required>
          </label>
          <label class="field">
            <span>FPS</span>
            <input id="fps" name="fps" type="number" min="1" max="60" step="1" value="24" required>
          </label>
        </div>

        <!-- Advanced controls -->
        <details class="advanced">
          <summary>Advanced controls</summary>
          <div class="advanced-content">
            <div class="advanced-grid">
              <label class="field">
                <span>Map style</span>
                <select name="map_type">
                  <option value="roadmap" selected>Roadmap</option>
                  <option value="satellite">Satellite</option>
                  <option value="terrain">Terrain</option>
                  <option value="hybrid">Hybrid</option>
                </select>
              </label>
              <label class="field">
                <span>Trail color</span>
                <input name="trail_color" type="color" value="#ff2f2f">
              </label>
              <label class="field">
                <span>Avatar</span>
                <select id="avatar-select" name="avatar_id">
                 {% for avatar_id, avatar_label in avatars.items() %}
                  <option value="{{ avatar_id }}" {% if avatar_id == "default" %}selected{% endif %}>{{ avatar_label }}</option>
                  {% endfor %}
                </select>
              </label>
              <label class="field">
                <span>Trail width (px)</span>
                <div class="preview-field">
                  <input id="trail-width" name="trail_width" type="number" min="1" max="24" step="1" value="6">
                  <span class="size-preview trail-size-preview" aria-hidden="true">
                    <span id="trail-preview-line"></span>
                  </span>
                </div>
              </label>
              <label class="field">
                <span>Avatar size (px)</span>
                <div class="preview-field">
                  <input id="avatar-size" name="arrow_size" type="number" min="16" max="160" step="1" value="54">
                  <span class="size-preview avatar-size-preview" aria-hidden="true">
                    <img id="avatar-preview" src="/api/avatars/default/preview?size=54" alt="">
                  </span>
                </div>
              </label>

            </div>

            <div class="toggle-grid" style="margin-top: 12px;">
              <label class="toggle-label"><input name="show_progress_bar" type="checkbox" checked> Progress bar</label>
              <label class="toggle-label"><input name="show_distance" type="checkbox" checked> Distance</label>
              <label class="toggle-label"><input name="show_speed" type="checkbox" checked> Speed graph</label>
              <label class="toggle-label"><input name="show_elevation" type="checkbox" checked> Elevation graph</label>
            </div>
          </div>
        </details>

        <label class="budget-confirm" id="budget-confirm" hidden>
          <input id="confirm-over-budget" name="confirm_over_budget" type="checkbox">
          <span>This render exceeds 750 Google map requests. Check to confirm.</span>
        </label>

        <button class="primary-button" id="render-button" type="submit">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3.5l7 4.5-7 4.5V3.5Z"/></svg>
          Render MP4
        </button>
      </form>

      <section class="panel status-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Output</p>
            <h2 id="status-title">Ready</h2>
          </div>
          <span class="badge muted" id="format-badge">1280 × 720</span>
        </div>

        <div class="video-stage" id="video-stage">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7a92ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
            </div>
            <strong>No render yet</strong>
            <span>Upload a GPX file to preview the first frame, then click Render MP4 when settings look right.</span>
          </div>

          <img id="preview-image" class="preview-image" alt="First frame preview" hidden>

          <div class="stage-spinner" id="stage-spinner">
            <div class="spinner-ring"></div>
            <span class="spinner-label" id="spinner-label">Rendering…</span>
          </div>

          <video id="preview-video" controls hidden></video>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar"><span id="progress-fill"></span></div>
          <div class="progress-meta">
            <span id="progress-label">0%</span>
            <span id="request-label">0 actual requests</span>
          </div>
        </div>

        <p class="message" id="message"></p>
        <a class="download-link" id="download-link" href="#" hidden>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 12l-5-5h3V2h4v5h3l-5 5ZM2 14h12v-1.5H2V14Z"/></svg>
          Download MP4
        </a>
      </section>
    </section>
  </main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
