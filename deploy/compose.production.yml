services:
  app:
    build:
      context: ..
    image: gpx-route-generator:${DEPLOY_SHA:-local}
    ports:
      - "127.0.0.1:${GPX_PORT:-8001}:8000"
    env_file:
      - ${DEPLOY_ROOT:?Set DEPLOY_ROOT to the deployment root}/.env
    environment:
      APP_ENV: production
      ALLOW_UNPROTECTED_RENDERING: "false"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Set GOOGLE_MAPS_API_KEY in deployment .env}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:?Set RECAPTCHA_SITE_KEY in deployment .env}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:?Set RECAPTCHA_SECRET_KEY in deployment .env}
      PORT: 8000
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=5)); assert data['recaptcha_enabled'] is True and data['has_google_maps_key'] is True and data['recaptcha_site_key'] and data['avatars']"
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 6

volumes:
  app-data:
    name: gpx-route-generator-data
