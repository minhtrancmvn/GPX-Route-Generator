# Unknown hostnames must not fall through to an application vhost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 302 https://minhtran.id.vn;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # TLS needs a certificate before Nginx can send an HTTP redirect.
    # Unknown hostnames are not necessarily covered by this existing certificate.
    ssl_certificate /etc/letsencrypt/live/waybill-generator.minhtran.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waybill-generator.minhtran.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 302 https://minhtran.id.vn;
}
