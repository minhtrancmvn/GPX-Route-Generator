server {
    listen 80;
    listen [::]:80;
    server_name gpx-route-generator.minhtran.id.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://gpx-route-generator.minhtran.id.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gpx-route-generator.minhtran.id.vn;
    ssl_certificate /etc/letsencrypt/live/gpx-route-generator.minhtran.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpx-route-generator.minhtran.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Direct (DNS-only, not proxied by Cloudflare) host for GPX uploads.
# Some ISPs stall uploads to Cloudflare's edge; the page stays proxied.
server {
    listen 80;
    listen [::]:80;
    server_name gpx-upload.minhtran.id.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gpx-upload.minhtran.id.vn;
    ssl_certificate /etc/letsencrypt/live/gpx-upload.minhtran.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpx-upload.minhtran.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 11m;
    # Multipart form POSTs are simple CORS requests, so no preflight is needed.
    add_header Access-Control-Allow-Origin "https://gpx-route-generator.minhtran.id.vn" always;

    location = /api/preview {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /api/render {
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        return 404;
    }
}
