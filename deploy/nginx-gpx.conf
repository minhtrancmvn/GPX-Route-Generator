server {
    listen 80;
    listen [::]:80;
    server_name gpx-route-generator.minhtran.id.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://gpx-route-generator.minhtran.id.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gpx-route-generator.minhtran.id.vn;
    ssl_certificate /etc/letsencrypt/live/gpx-route-generator.minhtran.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpx-route-generator.minhtran.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
