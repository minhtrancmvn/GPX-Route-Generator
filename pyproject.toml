[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx-route-generator"
version = "0.1.0"
description = "Local GPX route video renderer with Google Static Maps backgrounds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "gpxpy>=1.6",
    "pillow>=10.4",
    "numpy>=2.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpx_route_generator = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.gpx_route_generator.app:app"
