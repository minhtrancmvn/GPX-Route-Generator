services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      FRAME_WORKERS: ${FRAME_WORKERS:-4}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      MAX_ROUTE_POINTS: ${MAX_ROUTE_POINTS:-50000}
      MAX_ACTIVE_RENDERS: ${MAX_ACTIVE_RENDERS:-1}
      MAX_QUEUED_RENDERS: ${MAX_QUEUED_RENDERS:-2}
      ALLOW_UNPROTECTED_RENDERING: ${ALLOW_UNPROTECTED_RENDERING:-false}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
    name: gpx-route-generator-data
