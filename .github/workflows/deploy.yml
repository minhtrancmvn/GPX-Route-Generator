name: Deploy production

on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gpx-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lightsail-production
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
      SSH_USER: ${{ vars.LIGHTSAIL_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/home/ubuntu/gpx-route-generator' }}
    steps:
      - name: Check tested revision is still main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$DEPLOY_SHA" ]]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Skipping superseded revision\n'
          fi

      - name: Check out tested revision
        if: steps.revision.outputs.current == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure SSH
        if: steps.revision.outputs.current == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set SSH_HOST}" "${SSH_USER:?Set SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY}" "${SSH_KNOWN_HOSTS:?Set SSH_KNOWN_HOSTS}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/home/[a-zA-Z0-9_-]+/[a-zA-Z0-9/_-]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          install -m 700 -d "$RUNNER_TEMP/gpx-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/gpx-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/gpx-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/gpx-ssh/key" "$RUNNER_TEMP/gpx-ssh/known_hosts"

      - name: Upload and activate release
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/gpx-ssh/key" -p "$SSH_PORT"
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/gpx-ssh/known_hosts")
          remote="$SSH_USER@$SSH_HOST"
          release="$DEPLOY_ROOT/releases/$DEPLOY_SHA"
          # Client-side expansion is intentional; paths are validated above.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$release'"
          git archive --format=tar --output="$RUNNER_TEMP/gpx-release.tar" "$DEPLOY_SHA"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "tar -xf - -C '$release'" < "$RUNNER_TEMP/gpx-release.tar"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$DEPLOY_SHA" ]]; then
            printf 'Skipping superseded release before activation\n'
            exit 0
          fi
          # Recheck on host after lock acquisition to close concurrent-push window.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "bash '$release/deploy/deploy.sh' '$DEPLOY_ROOT' '$DEPLOY_SHA'"

      - name: Remove SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/gpx-ssh" "$RUNNER_TEMP/gpx-release.tar"
